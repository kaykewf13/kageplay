<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KagePlay — Catálogo Put.io</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #141420;
    --border: #2a2a3a;
    --text: #e8e8ef;
    --muted: #7a7a8a;
    --accent: #8b5cf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  header { margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

  #player-wrap {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); padding-bottom: 12px; margin-bottom: 12px;
  }
  video {
    width: 100%; max-height: 50vh; background: #000;
    border-radius: 12px; display: none;
  }
  video.ativo { display: block; }
  #now-playing { font-size: 13px; color: var(--accent); margin-top: 6px; min-height: 16px; }

  .controles { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input, select {
    padding: 10px; border-radius: 10px;
    border: 1px solid var(--border); background: #0e0e16; color: var(--text);
    font-size: 14px;
  }
  input { flex: 1; min-width: 180px; }

  .grade {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .card {
    text-align: left; padding: 12px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); cursor: pointer; font-size: 13px; line-height: 1.35;
    transition: border-color .15s, transform .1s;
  }
  .card:hover { border-color: var(--accent); }
  .card:active { transform: scale(.97); }
  .card strong { display: block; margin-bottom: 4px; }
  .card .g { color: var(--muted); font-size: 11px; }

  .status { color: var(--muted); font-size: 14px; padding: 20px 0; }
  .erro { color: #f87171; }
</style>
</head>
<body>
<header>
  <h1>🎬 KagePlay — Catálogo Put.io</h1>
  <div class="sub" id="contador">Carregando…</div>
</header>

<div id="player-wrap">
  <video id="player" controls playsinline></video>
  <div id="now-playing"></div>
</div>

<div class="controles">
  <input id="busca" type="text" placeholder="Buscar título…" autocomplete="off">
  <select id="genero"><option value="">Todos os gêneros</option></select>
</div>

<div id="catalogo" class="grade"></div>
<div id="status" class="status">Carregando catálogo…</div>

<script>
const INDEX_URL = "https://raw.githubusercontent.com/kaykewf13/SUGOIAPI/main/output/anime_index.json";
const WORKER_BASE = "https://sugoiapi-putio-proxy.viraltechh.workers.dev";

let TODOS = [];
let hls = null;

async function carregar() {
  try {
    const res = await fetch(`${INDEX_URL}?t=${Date.now()}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    TODOS = data.itens || [];
    document.getElementById("contador").textContent =
      `${TODOS.length} títulos · atualizado ${new Date(data.gerado_em).toLocaleDateString("pt-BR")}`;
    montarGeneros();
    render(TODOS);
    document.getElementById("status").textContent = "";
  } catch (e) {
    document.getElementById("status").innerHTML =
      `<span class="erro">Erro ao carregar catálogo: ${e.message}</span>`;
  }
}

function montarGeneros() {
  const sel = document.getElementById("genero");
  const grupos = [...new Set(TODOS.map(i => i.grupo).filter(Boolean))].sort();
  grupos.forEach(g => {
    const o = document.createElement("option");
    o.value = g; o.textContent = g;
    sel.appendChild(o);
  });
}

function filtrar() {
  const t = document.getElementById("busca").value.toLowerCase();
  const g = document.getElementById("genero").value;
  return TODOS.filter(i =>
    (!t || i.nome.toLowerCase().includes(t)) &&
    (!g || i.grupo === g)
  );
}

function render(itens) {
  const root = document.getElementById("catalogo");
  root.innerHTML = "";
  if (!itens.length) {
    root.innerHTML = '<div class="status">Nenhum título encontrado.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  itens.forEach(item => {
    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML = `<strong>${escapeHtml(item.nome)}</strong><span class="g">${escapeHtml(item.grupo || "")}</span>`;
    card.onclick = () => tocar(item);
    frag.appendChild(card);
  });
  root.appendChild(frag);
}

function tocar(item) {
  const player = document.getElementById("player");
  const src = `${WORKER_BASE}/?id=${item.id}`;
  player.classList.add("ativo");
  document.getElementById("now-playing").textContent = "▶ " + item.nome;

  if (hls) { hls.destroy(); hls = null; }

  // Put.io entrega arquivo direto (mp4/mkv) via redirect do Worker.
  // HLS.js só entra se a fonte for .m3u8.
  if (src.includes(".m3u8") && window.Hls && window.Hls.isSupported()) {
    hls = new window.Hls();
    hls.loadSource(src);
    hls.attachMedia(player);
  } else {
    player.src = src;
  }
  player.scrollIntoView({ behavior: "smooth", block: "start" });
  player.play().catch(() => {});
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

document.getElementById("busca").addEventListener("input", () => render(filtrar()));
document.getElementById("genero").addEventListener("change", () => render(filtrar()));

carregar();
</script>
</body>
</html>
